<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUDNEX</title>
<style>
:root{
  --bg:#0c0c0c; --panel:#161616; --panel2:#1e1e1e; --border:#2a2a2a;
  --gold:#F2C200; --gold2:#FFDE59; --text:#f2f2f2; --muted:#9a9a9a;
  --green:#3ecf5e; --red:#e05656; --blue:#4a9eff; --orange:#ff9f43;
  --radius:10px; --font: 'Segoe UI', Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f4f4f4; --panel:#ffffff; --panel2:#f0f0f0; --border:#ddd;
  --text:#1a1a1a; --muted:#666;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);
}
#topbar .logo{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
#topbar .logo .ex{color:var(--gold);}
#dbstatus{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
#dbstatus .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
#dbstatus.offline .dot{background:var(--red);}
#searchbox{flex:1;position:relative;max-width:420px;}
#searchbox input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
#searchResults{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;max-height:320px;overflow:auto;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#searchResults .sr-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;}
#searchResults .sr-item:hover{background:var(--panel2);}
#searchResults .sr-item .sr-type{color:var(--gold);font-size:10px;font-weight:700;text-transform:uppercase;margin-right:6px;}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:6px;}
.icon-btn:hover{background:var(--panel2);}
#bellBtn{position:relative;}
#bellDot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red);display:none;}

#body{flex:1;display:flex;min-height:0;}
#sidebar{width:210px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto;}
#sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;border-left:3px solid transparent;}
#sidebar .nav-item:hover{color:var(--text);background:var(--panel2);}
#sidebar .nav-item.active{color:var(--gold);border-left-color:var(--gold);background:var(--panel2);}
#sidebar .nav-item .ic{width:18px;text-align:center;}
#main{flex:1;overflow-y:auto;padding:22px 26px;min-width:0;}

/* ---------- generic components ---------- */
.page-title{font-size:20px;font-weight:800;margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--border);}
.btn:hover{filter:brightness(1.15);}
.btn.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn.small{padding:5px 10px;font-size:12px;}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar input[type=text],.toolbar input[type=search],.toolbar select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
.spacer{flex:1;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}

.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi .kpi-label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.kpi .kpi-value{font-size:24px;font-weight:800;margin-top:6px;}
.kpi .kpi-breakdown{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;}
.kpi .kpi-breakdown span b{color:var(--text);}

table.dt{width:100%;border-collapse:collapse;font-size:13px;}
table.dt th{text-align:left;padding:8px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--border);}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--border);}
table.dt tbody tr:hover{background:var(--panel2);cursor:pointer;}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700;}
.badge.gray{background:#333;color:#ccc;}
.badge.green{background:#1e4620;color:#8fe39a;}
.badge.gold{background:#4a3c00;color:var(--gold2);}
.badge.red{background:#4a1f1f;color:#ff9d9d;}
.badge.blue{background:#123354;color:#9ec9ff;}

/* modal */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;}
#modalOverlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:520px;max-width:92vw;max-height:88vh;overflow:auto;padding:20px 22px;}
.modal h3{margin:0 0 14px;font-size:16px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
.form-row textarea{min-height:70px;resize:vertical;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

/* toasts */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;font-size:13px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.toast.error{border-left-color:var(--red);}
.toast.success{border-left-color:var(--green);}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:0 0 250px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
.kanban-col h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;}
.kanban-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px;cursor:grab;}
.kanban-card:active{cursor:grabbing;}
.kanban-card .kc-title{font-weight:700;margin-bottom:4px;}
.kanban-card .kc-meta{color:var(--muted);font-size:11px;}
.kanban-col.dragover{background:#2a2510;}

/* connection banner */
#connBanner{display:none;background:#4a1f1f;color:#ffcaca;padding:10px 16px;font-size:13px;align-items:center;gap:12px;}
#connBanner.show{display:flex;}

/* margin warning */
.margin-warn{background:#4a3c00;color:var(--gold2);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* setup screen */
#setupScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;}
#setupScreen .box{width:480px;max-width:92vw;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;}
#setupScreen h2{margin:0 0 6px;}
#setupScreen p{color:var(--muted);font-size:13px;line-height:1.6;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab-btn{padding:9px 14px;background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}

.chart-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-title{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:10px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .btn{margin-top:14px;}

@media(max-width:800px){
  #sidebar{position:fixed;left:-220px;top:56px;bottom:0;z-index:100;transition:left .2s;}
  #sidebar.open{left:0;}
  #searchbox{display:none;}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="setupScreen" style="display:none;">
  <div class="box">
    <h2>Налаштування BUDNEX</h2>
    <p>Встав URL Google Apps Script Web App (Deploy → New deployment → Web app → скопіювати /exec URL). Це потрібно один раз — далі BUDNEX сам підключатиметься до твоєї Google Таблиці.</p>
    <div class="form-row">
      <label>Apps Script Web App URL</label>
      <input type="text" id="setupUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div id="setupError" style="color:var(--red);font-size:12.5px;margin-bottom:10px;display:none;"></div>
    <div class="form-actions" style="justify-content:flex-start;">
      <button class="btn primary" id="setupConnectBtn">Підключити</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="topbar">
    <div class="logo">BUDN<span class="ex">EX</span></div>
    <div id="dbstatus" class="offline"><span class="dot"></span><span id="dbstatusText">DATABASE OFFLINE</span></div>
    <div id="searchbox">
      <input type="text" id="globalSearch" placeholder="Пошук: клієнт, телефон, об'єкт, адреса, робота, ID...">
      <div id="searchResults"></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="userChipBtn">👤 —</button>
      <button class="icon-btn" id="syncBtn">🔄 Синхронізувати</button>
      <button class="icon-btn" id="bellBtn">🔔<span id="bellDot"></span></button>
      <button class="icon-btn" id="themeBtn">🌓</button>
    </div>
  </div>
  <div id="connBanner">
    <span>⚠ Не вдалося підключитися до бази даних.</span>
    <button class="btn small" id="retryConnBtn">ПОВТОРИТИ</button>
  </div>
  <div id="body">
    <div id="sidebar"></div>
    <div id="main"></div>
  </div>
</div>

<div id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div id="toastWrap"></div>

<script>
'use strict';

/* ============================== CONFIG ================================= */
var CONFIG = {
  API_URL: localStorage.getItem('budnex_api_url') || '',
  APP_NAME: 'BUDNEX'
};

/* ============================== STATE =================================== */
var STATE = {
  online: false,
  lastSync: null,
  route: '#/dashboard',
  db: { settings:{}, clients:[], requests:[], objects:[], works:[], categories:[], estimates:[],
        estimateItems:[], partners:[], teams:[], assignments:[], payments:[], expenses:[], tasks:[], notifications:[],
        projects:[], projectRooms:[], projectWalls:[], projectOpenings:[], projectElements:[], boq:[], projectMaterials:[],
        materials:[], suppliers:[], packages:[], packageItems:[], photos:[], documents:[], users:[], roles:[] },
  ui: { theme: localStorage.getItem('budnex_theme') || 'dark', priceView: 'internal' },
  currentUser: null
};

var NAV = [
  { id:'dashboard', label:'Дашборд', icon:'📊', roles:null },
  { id:'clients', label:'Клієнти', icon:'👤', roles:null },
  { id:'requests', label:'Заявки', icon:'📥', roles:null },
  { id:'objects', label:"Об'єкти", icon:'🏗️', roles:null },
  { id:'works', label:'Прайс робіт', icon:'📋', roles:['ADMIN','MANAGER','ESTIMATOR'] },
  { id:'estimates', label:'Кошториси', icon:'🧾', roles:['ADMIN','MANAGER','ESTIMATOR'] },
  { id:'partners', label:'Бригади', icon:'👷', roles:null },
  { id:'materials', label:'Матеріали і пакети', icon:'📦', roles:['ADMIN','MANAGER','ESTIMATOR'] },
  { id:'finance', label:'Фінанси', icon:'💰', roles:['ADMIN','MANAGER','ACCOUNTANT'] },
  { id:'calendar', label:'Календар', icon:'📅', roles:null },
  { id:'tasks', label:'Завдання', icon:'✅', roles:null },
  { id:'analytics', label:'Аналітика', icon:'📈', roles:['ADMIN','MANAGER','ACCOUNTANT'] },
  { id:'settings', label:'Налаштування', icon:'⚙️', roles:['ADMIN'] }
];

// TZ section 65 — UI-level duty segregation (see the ROLES comment in
// Code.gs for why this can't be a real server-side security boundary on an
// Apps Script Web App deployed as "Anyone"). ADMIN always sees everything.
function currentRole_() { return STATE.currentUser ? STATE.currentUser.role : 'ADMIN'; }
function roleAllows_(navItem) { return !navItem.roles || navItem.roles.indexOf(currentRole_()) !== -1 || currentRole_() === 'ADMIN'; }

var REQUEST_STATUSES = ['NEW','CONTACT','INSPECTION','ESTIMATE','SENT','NEGOTIATION','APPROVED','PREPARATION','IN PROGRESS','ACCEPTANCE','COMPLETED','REJECTED','PAUSED'];
var REQUEST_STATUS_LABELS = {NEW:'Нова',CONTACT:'Контакт',INSPECTION:'Огляд',ESTIMATE:'Кошторис',SENT:'Надіслано',NEGOTIATION:'Погодження',APPROVED:'Затверджено',PREPARATION:'Підготовка','IN PROGRESS':'У роботі',ACCEPTANCE:'Приймання',COMPLETED:'Завершено',REJECTED:'Відмова',PAUSED:'Пауза'};
var KANBAN_STATUSES = ['NEW','CONTACT','INSPECTION','ESTIMATE','SENT','NEGOTIATION','APPROVED','PREPARATION','IN PROGRESS','ACCEPTANCE','COMPLETED'];

var OBJECT_STATUSES = ['новий','огляд','кошторис','погодження','підготовка','у роботі','завершено'];
var TASK_STATUSES = ['TODO','IN PROGRESS','DONE','BLOCKED'];
var TASK_STATUS_LABELS = {TODO:'Зробити','IN PROGRESS':'У роботі',DONE:'Готово',BLOCKED:'Заблоковано'};

/* ============================== STORAGE ================================= */
var Storage = {
  saveCache: function () {
    try { localStorage.setItem('budnex_cache', JSON.stringify({ db: STATE.db, ts: Date.now() })); } catch (e) {}
  },
  loadCache: function () {
    try {
      var raw = localStorage.getItem('budnex_cache');
      if (!raw) return false;
      var parsed = JSON.parse(raw);
      STATE.db = parsed.db;
      return true;
    } catch (e) { return false; }
  },
  queue: {
    get: function () { try { return JSON.parse(localStorage.getItem('budnex_queue') || '[]'); } catch (e) { return []; } },
    set: function (q) { localStorage.setItem('budnex_queue', JSON.stringify(q)); },
    push: function (action, data) { var q = this.get(); q.push({ action: action, data: data, ts: Date.now() }); this.set(q); },
    clear: function () { this.set([]); }
  }
};

var MUTATIONS = ['createClient','updateClient','deleteClient','createRequest','updateRequest','deleteRequest',
  'createObject','updateObject','deleteObject','createWork','updateWork','deleteWork','createEstimate','updateEstimate',
  'deleteEstimate','addEstimateItem','updateEstimateItem','deleteEstimateItem','createPartner','updatePartner','deletePartner',
  'createTeam','updateTeam','deleteTeam','createAssignment','updateAssignment','createPayment','createExpense','createTask',
  'updateTask','markNotificationRead','saveSetting',
  // ЕТАП 5-8 mutations (planner, BOQ, materials/suppliers/packages, photos, documents, users) —
  // these were missing here, so a failed call while offline silently dropped the change
  // instead of queuing it for retry, which looked identical to "the button doesn't work".
  'createProject','updateProject','deleteProject',
  'createProjectRoom','updateProjectRoom','deleteProjectRoom',
  'createProjectWall','updateProjectWall','deleteProjectWall',
  'createProjectOpening','updateProjectOpening','deleteProjectOpening',
  'createProjectElement','updateProjectElement','deleteProjectElement',
  'generateBOQFromProject','createBOQItem','updateBOQItem','deleteBOQItem',
  'computeProjectMaterials','generateEstimateFromBOQ',
  'createDocument','deleteDocument',
  'createMaterial','updateMaterial','deleteMaterial',
  'createSupplier','updateSupplier','deleteSupplier',
  'createPackage','updatePackage','deletePackage','addPackageItem','deletePackageItem','addPackageToEstimate',
  'uploadPhoto','deletePhoto',
  'createUser','updateUser','deleteUser','loginAs',
  'aiGenerateRooms'];

/* ================================ API ==================================== */
function apiCall(action, data) {
  if (!CONFIG.API_URL) return Promise.reject(new Error('API_URL не налаштований'));
  return fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify({ action: action, data: data || {} })
  }).then(function (res) { return res.json(); })
    .then(function (json) {
      if (!json.success) throw new Error(json.error || 'Невідома помилка сервера');
      setOnline_(true);
      return json.data;
    }).catch(function (err) {
      setOnline_(false);
      if (MUTATIONS.indexOf(action) !== -1) {
        Storage.queue.push(action, data);
        toast('Дані не втрачені. Зміну додано в чергу синхронізації.', 'error');
      }
      throw err;
    });
}

function setOnline_(isOnline) {
  var wasOffline = !STATE.online;
  STATE.online = isOnline;
  var el = document.getElementById('dbstatus');
  var txt = document.getElementById('dbstatusText');
  var banner = document.getElementById('connBanner');
  if (isOnline) {
    el.classList.remove('offline'); txt.textContent = 'DATABASE ONLINE';
    banner.classList.remove('show');
    if (wasOffline) flushQueue();
  } else {
    el.classList.add('offline'); txt.textContent = 'DATABASE OFFLINE';
  }
}

function flushQueue() {
  var q = Storage.queue.get();
  if (!q.length) return;
  Storage.queue.clear();
  var chain = Promise.resolve();
  q.forEach(function (item) {
    chain = chain.then(function () { return apiCall(item.action, item.data).catch(function () {}); });
  });
  chain.then(function () { syncAll(); });
}

function syncAll() {
  document.getElementById('syncBtn').textContent = '🔄 Синхронізація...';
  return apiCall('bootstrap', {}).then(function (data) {
    STATE.db = {
      settings: data.settings || {}, clients: data.clients || [], requests: data.requests || [],
      objects: data.objects || [], works: data.works || [], categories: data.categories || [],
      estimates: data.estimates || [], estimateItems: data.estimateItems || [], partners: data.partners || [],
      teams: data.teams || [], assignments: data.assignments || [], payments: data.payments || [],
      expenses: data.expenses || [], tasks: data.tasks || [], notifications: data.notifications || [],
      projects: data.projects || [], projectRooms: data.projectRooms || [], projectWalls: data.projectWalls || [],
      projectOpenings: data.projectOpenings || [], projectElements: data.projectElements || [], boq: data.boq || [],
      projectMaterials: data.projectMaterials || [], materials: data.materials || [], suppliers: data.suppliers || [],
      packages: data.packages || [], packageItems: data.packageItems || [], photos: data.photos || [],
      documents: data.documents || [], users: data.users || [], roles: data.roles || []
    };
    STATE.lastSync = new Date();
    Storage.saveCache();
    document.getElementById('syncBtn').textContent = '🔄 Синхронізувати';
    renderRoute();
    updateBellDot();
  }).catch(function (err) {
    document.getElementById('syncBtn').textContent = '🔄 Синхронізувати';
    document.getElementById('connBanner').classList.add('show');
    console.error(err);
  });
}

/* ================================ UI helpers ============================= */
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function fmtMoney(n) { n = Number(n) || 0; return n.toLocaleString('uk-UA', { maximumFractionDigits: 0 }) + ' грн'; }
function fmtNum(n) { n = Number(n) || 0; return n.toLocaleString('uk-UA', { maximumFractionDigits: 2 }); }
function fmtDate(s) { if (!s) return '—'; var d = new Date(s); if (isNaN(d)) return s; return d.toLocaleDateString('uk-UA'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function byId(arr, id) { return arr.filter(function (x) { return x.id === id; })[0]; }

function toast(msg, type) {
  var t = el('div', { class: 'toast' + (type ? ' ' + type : '') }, [msg]);
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 300); }, 4200);
}

function openModal(title, bodyEl, opts) {
  var box = document.getElementById('modalBox');
  box.innerHTML = '';

function kpiCard(label, value, breakdown) {

function groupCount_(arr, field) {
  var m = {};
  arr.forEach(function (x) { var k = x[field] || '—'; m[k] = (m[k] || 0) + 1; });
  return m;
}
function sum_(arr, field) { return arr.reduce(function (s, x) { return s + (Number(x[field]) || 0); }, 0); }

function monthlySeries_(arr, dateField, sumField) {
  var m = {};
  arr.forEach(function (x) {
    var d = new Date(x[dateField]); if (isNaN(d)) return;
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    m[key] = (m[key] || 0) + (sumField ? (Number(x[sumField]) || 0) : 1);
  });
  var keys = Object.keys(m).sort().slice(-6);
  return keys.map(function (k) { return { label: k.slice(5) + '.' + k.slice(2,4), value: m[k] }; });
}

function chartCard(title, series) {
  var wrap = el('div', { class: 'chart-wrap' });
  wrap.appendChild(el('div', { class: 'chart-title' }, [title]));
  if (!series.length) { wrap.appendChild(el('div', { style: 'color:var(--muted);font-size:12px;' }, ['Недостатньо даних.'])); return wrap; }
  var max = Math.max.apply(null, series.map(function (s) { return s.value; }), 1);
  var w = 320, h = 120, barW = w / series.length - 8;
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + (h + 20));
  svg.setAttribute('width', '100%'); svg.setAttribute('height', h + 20);
  series.forEach(function (s, i) {
    var barH = max > 0 ? (s.value / max) * h : 0;
    var x = i * (w / series.length) + 4;
    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', h - barH);
    rect.setAttribute('width', Math.max(barW, 4)); rect.setAttribute('height', barH);
    rect.setAttribute('fill', '#F2C200'); rect.setAttribute('rx', 3);
    svg.appendChild(rect);
    var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', x + barW / 2); txt.setAttribute('y', h + 14);
    txt.setAttribute('font-size', '9'); txt.setAttribute('fill', '#9a9a9a'); txt.setAttribute('text-anchor', 'middle');
    txt.textContent = s.label;
    svg.appendChild(txt);
  });
  wrap.appendChild(svg);
  return wrap;
}

      STATE.db.estimateItems.push(res.item);
      var ei = STATE.db.estimates.findIndex(function (x) { return x.id === res.estimate.id; });
      STATE.db.estimates[ei] = res.estimate;
      Storage.saveCache(); closeModal(); renderRoute(); toast('Додано', 'success');

/* ==================== ЕТАП 5/6: PLANNING TAB (SVG PLANNER + BOQ) =========== */
function svgEl(tag, attrs, children) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  attrs = attrs || {};
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (children || []).forEach(function (c) { e.appendChild(c); });
  return e;
}

var PLANNER_PX_PER_M = 40;
var PLANNER_LAYER_COLORS = { electrical: '#F2C200', plumbing: '#3B82F6', heating: '#EF4444', ventilation: '#22C55E' };
var PLANNER_LAYER_LABELS = { electrical: 'Електрика', plumbing: 'Сантехніка', heating: 'Опалення', ventilation: 'Вентиляція' };

function renderObjectPlanningTab(container, o) {

  if (!project) {

        b.onclick = function () {

            STATE.db.projects.push(res); Storage.saveCache(); renderRoute();
          }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
        };
        return b;
      })()
    ]));

  }

function renderPlanner(container, project, o) {
  var mode = { current: 'select', pendingPoint: null, engLayer: 'electrical' };
  var visibleLayers = { electrical: true, plumbing: true, heating: true, ventilation: true };

  container.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;' }, [
    el('div', {}, [el('b', {}, [project.name]), el('div', { class: 'page-sub' }, ['Загальна площа: ' + fmtNum(project.area) + ' м²'])]),
  ]));

  var toolbar = el('div', { class: 'toolbar', style: 'flex-wrap:wrap;gap:6px;' });
  function modeBtn(id, label) {
    var b = el('button', { class: 'btn small' + (mode.current === id ? ' primary' : '') }, [label]);
    b.onclick = function () { mode.current = id; mode.pendingPoint = null; redrawToolbar(); redrawCanvas(); };
    return b;
  }
  var toolbarButtons = [];
  function redrawToolbar() {
    toolbar.innerHTML = '';
    toolbarButtons = [
      modeBtn('select', '↕ Вибір / перетягнути'),
      modeBtn('draw-wall', '📏 Малювати стіну'),
      modeBtn('add-door', '🚪 Додати двері'),
      modeBtn('add-window', '🪟 Додати вікно')
    ];
    toolbarButtons.forEach(function (b) { toolbar.appendChild(b); });
    var layerSelect = el('select', { style: 'margin-left:8px;' });
    Object.keys(PLANNER_LAYER_LABELS).forEach(function (k) { layerSelect.appendChild(el('option', { value: k }, [PLANNER_LAYER_LABELS[k]])); });
    layerSelect.value = mode.engLayer;
    layerSelect.onchange = function () { mode.engLayer = layerSelect.value; };
    toolbar.appendChild(layerSelect);
    var addElBtn = el('button', { class: 'btn small' + (mode.current === 'add-element' ? ' primary' : '') }, ['+ Інж. елемент']);
    addElBtn.onclick = function () { mode.current = 'add-element'; redrawToolbar(); redrawCanvas(); };
    toolbar.appendChild(addElBtn);
    var addRoomBtn = el('button', { class: 'btn small primary' }, ['+ Приміщення (точно)']);
    addRoomBtn.onclick = function () { openRoomForm(project); };
    toolbar.appendChild(addRoomBtn);
    var aiBtn = el('button', { class: 'btn small' }, ['🤖 AI-планування приміщень']);
    aiBtn.onclick = function () { openAiRoomGenModal(project); };
    toolbar.appendChild(aiBtn);
  }
  redrawToolbar();
  container.appendChild(toolbar);

  var layerToggleRow = el('div', { style: 'display:flex;gap:14px;margin:8px 0;font-size:12px;color:var(--muted);' });
  Object.keys(PLANNER_LAYER_LABELS).forEach(function (k) {
    var lbl = el('label', { style: 'display:flex;align-items:center;gap:4px;cursor:pointer;' });
    var cb = el('input', { type: 'checkbox' }); cb.checked = true;
    cb.onchange = function () { visibleLayers[k] = cb.checked; redrawCanvas(); };
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(PLANNER_LAYER_LABELS[k]));
    layerToggleRow.appendChild(lbl);
  });
  container.appendChild(layerToggleRow);

  var svgWrap = el('div', { class: 'card', style: 'padding:0;overflow:auto;' });
  var svg = svgEl('svg', { width: '760', height: '460', style: 'background:var(--panel2);display:block;cursor:crosshair;' });
  svgWrap.appendChild(svg);
  container.appendChild(svgWrap);
  container.appendChild(el('div', { class: 'page-sub', style: 'margin-top:6px;' }, [
    '"Малювати стіну": клікни початкову і кінцеву точку. "Двері"/"Вікно": клікни на стіні. "Інж. елемент": обери шар вище і клікни на плані. "Вибір": перетягуй приміщення мишею.'
  ]));

  function m2px(m) { return m * PLANNER_PX_PER_M + 20; }
  function px2m(px) { return (px - 20) / PLANNER_PX_PER_M; }

  // Single shared drag state + one set of window listeners for the whole
  // planner instance (not re-added per room per redraw), so dragging never
  // accumulates duplicate handlers across re-renders. A drag that moved less
  // than 4px is treated as a plain click (opens the room's edit form) rather
  // than a position change — see the mouseup handler below.
  var dragState = null;
  var justDragged = false;
  window.addEventListener('mousemove', function (e) {
    if (!dragState) return;
    var dx = e.clientX - dragState.startClientX, dy = e.clientY - dragState.startClientY;
    if (Math.sqrt(dx * dx + dy * dy) > 4) dragState.moved = true;
    if (!dragState.moved) return;
    var svgRect = svg.getBoundingClientRect();
    var localX = e.clientX - svgRect.left, localY = e.clientY - svgRect.top;
    var r = dragState.room;
    var newX = Math.max(0, round2(px2m(localX) - r.width / 2)), newY = Math.max(0, round2(px2m(localY) - r.length / 2));
    dragState.rect.setAttribute('x', m2px(newX)); dragState.rect.setAttribute('y', m2px(newY));
    dragState.label.setAttribute('x', m2px(newX) + 6); dragState.label.setAttribute('y', m2px(newY) + 16);
    dragState.pendingX = newX; dragState.pendingY = newY;
  });
  window.addEventListener('mouseup', function () {
    if (!dragState) return;
    var ds = dragState; dragState = null;
    if (ds.moved && ds.pendingX != null) {
      justDragged = true; // suppress the click that follows a real drag
      apiCall('updateProjectRoom', { id: ds.room.id, x: ds.pendingX, y: ds.pendingY }).then(function (res) {
        var i = STATE.db.projectRooms.findIndex(function (x) { return x.id === ds.room.id; });
        STATE.db.projectRooms[i] = res.room; Storage.saveCache();
      }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
    } else if (!ds.moved && mode.current === 'select') {
      openRoomForm(project, ds.room); // a click, not a drag — open the room for editing
    }
  });

  function nearestWall_(xm, ym) {
    var walls = STATE.db.projectWalls.filter(function (w) { return w.project_id === project.id; });
    var best = null, bestDist = Infinity;
    walls.forEach(function (w) {
      var dx = w.x2 - w.x1, dy = w.y2 - w.y1;
      var len2 = dx * dx + dy * dy || 1;
      var t = Math.max(0, Math.min(1, ((xm - w.x1) * dx + (ym - w.y1) * dy) / len2));
      var px = w.x1 + t * dx, py = w.y1 + t * dy;
      var dist = Math.sqrt(Math.pow(xm - px, 2) + Math.pow(ym - py, 2));
      if (dist < bestDist) { bestDist = dist; best = { wall: w, x: px, y: py }; }
    });
    return best;
  }

  function redrawCanvas() {
    svg.innerHTML = '';
    var rooms = STATE.db.projectRooms.filter(function (r) { return r.project_id === project.id; });
    var walls = STATE.db.projectWalls.filter(function (w) { return w.project_id === project.id; });
    var openings = STATE.db.projectOpenings.filter(function (op) { return op.project_id === project.id; });
    var elements = STATE.db.projectElements.filter(function (e) { return e.project_id === project.id; });

    rooms.forEach(function (r) {
      var g = svgEl('g', { style: 'cursor:' + (mode.current === 'select' ? 'move' : 'default') });
      var rect = svgEl('rect', {
        x: m2px(r.x), y: m2px(r.y), width: r.width * PLANNER_PX_PER_M, height: r.length * PLANNER_PX_PER_M,
        fill: 'rgba(242,194,0,0.12)', stroke: '#F2C200', 'stroke-width': '2'
      });
      var label = svgEl('text', { x: m2px(r.x) + 6, y: m2px(r.y) + 16, fill: 'var(--text)', 'font-size': '11' }, []);
      label.textContent = r.name + ' (' + fmtNum(r.area) + ' м²)';
      g.appendChild(rect); g.appendChild(label);
      // Only "select" mode reacts to room mousedown at all — in every drawing
      // mode (wall/door/window/element) a click over a room must fall through
      // untouched to the svg-level click handler below, not open the room's
      // edit form on top of it.
      if (mode.current === 'select') {
        g.addEventListener('mousedown', function (e) {
          e.stopPropagation();
          dragState = { room: r, rect: rect, label: label, startClientX: e.clientX, startClientY: e.clientY, moved: false };
        });
      }
      svg.appendChild(g);
    });

    walls.forEach(function (w) {
      svg.appendChild(svgEl('line', { x1: m2px(w.x1), y1: m2px(w.y1), x2: m2px(w.x2), y2: m2px(w.y2), stroke: 'var(--text)', 'stroke-width': String(Math.max(2, w.thickness * PLANNER_PX_PER_M)) }));
    });

    openings.forEach(function (op) {
      var color = op.type === 'вікно' ? '#3B82F6' : '#8B5E3C';
      svg.appendChild(svgEl('rect', { x: m2px(op.x) - 5, y: m2px(op.y) - 5, width: 10, height: 10, fill: color, stroke: '#fff', 'stroke-width': '1' }));
    });

    elements.forEach(function (e) {
      if (!visibleLayers[e.type]) return;
      svg.appendChild(svgEl('circle', { cx: m2px(e.x), cy: m2px(e.y), r: 5, fill: PLANNER_LAYER_COLORS[e.type] || '#888' }));
    });

    if (mode.pendingPoint) {
      svg.appendChild(svgEl('circle', { cx: m2px(mode.pendingPoint.x), cy: m2px(mode.pendingPoint.y), r: 4, fill: 'red' }));
    }
  }

  svg.addEventListener('click', function (e) {
    if (justDragged) { justDragged = false; return; }
    if (mode.current === 'select') return;
    var svgRect = svg.getBoundingClientRect();
    var xm = round2(px2m(e.clientX - svgRect.left)), ym = round2(px2m(e.clientY - svgRect.top));
    if (mode.current === 'draw-wall') {
      if (!mode.pendingPoint) { mode.pendingPoint = { x: xm, y: ym }; redrawCanvas(); return; }
      apiCall('createProjectWall', { project_id: project.id, x1: mode.pendingPoint.x, y1: mode.pendingPoint.y, x2: xm, y2: ym }).then(function (res) {
        STATE.db.projectWalls.push(res); Storage.saveCache(); mode.pendingPoint = null; redrawCanvas(); toast('Стіну додано', 'success');
      }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
    } else if (mode.current === 'add-door' || mode.current === 'add-window') {
      var near = nearestWall_(xm, ym);
      apiCall('createProjectOpening', { project_id: project.id, type: mode.current === 'add-door' ? 'двері' : 'вікно', wall_id: near ? near.wall.id : '', x: near ? near.x : xm, y: near ? near.y : ym }).then(function (res) {
        STATE.db.projectOpenings.push(res); Storage.saveCache(); redrawCanvas(); toast((mode.current === 'add-door' ? 'Двері' : 'Вікно') + ' додано' + (near ? '' : ' (стіну поруч не знайдено)'), 'success');
      }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
    } else if (mode.current === 'add-element') {
      apiCall('createProjectElement', { project_id: project.id, type: mode.engLayer, x: xm, y: ym }).then(function (res) {
        STATE.db.projectElements.push(res); Storage.saveCache(); redrawCanvas(); toast('Елемент додано (' + PLANNER_LAYER_LABELS[mode.engLayer] + ')', 'success');
      }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
    }
  });

  redrawCanvas();

  // ---- rooms/walls/openings/elements management lists ----
  container.appendChild(el('h4', { style: 'margin-top:18px;' }, ['Приміщення']));
  var roomsList = el('div'); container.appendChild(roomsList);
  STATE.db.projectRooms.filter(function (r) { return r.project_id === project.id; }).forEach(function (r) {
    var row = el('div', { class: 'card', style: 'margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;' }, [
      el('div', {}, [el('b', {}, [r.name]), el('span', { class: 'page-sub' }, [' · ' + r.type + ' · ' + fmtNum(r.width) + '×' + fmtNum(r.length) + ' м = ' + fmtNum(r.area) + ' м²'])])
    ]);
    var editB = el('button', { class: 'btn small' }, ['✎']); editB.onclick = function () { openRoomForm(project, r); };
    var delB = el('button', { class: 'btn small danger' }, ['✕']);
    delB.onclick = function () { apiCall('deleteProjectRoom', { id: r.id }).then(function (res) { STATE.db.projectRooms = STATE.db.projectRooms.filter(function (x) { return x.id !== r.id; }); var pi = STATE.db.projects.findIndex(function (x) { return x.id === project.id; }); if (pi !== -1 && res.project) STATE.db.projects[pi] = res.project; Storage.saveCache(); renderRoute(); }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); }); };
    row.appendChild(editB); row.appendChild(delB);
    roomsList.appendChild(row);
  });

  // ---- BOQ section (ЕТАП 6) ----
  container.appendChild(el('h4', { style: 'margin-top:18px;' }, ['Специфікація робіт (BOQ)']));
  var boqToolbar = el('div', { class: 'toolbar' });
  var genBoqBtn = el('button', { class: 'btn small primary' }, ['⚙ Згенерувати BOQ з плану']);
  genBoqBtn.onclick = function () {
    apiCall('generateBOQFromProject', { project_id: project.id }).then(function (res) {
      STATE.db.boq = STATE.db.boq.filter(function (x) { return x.project_id !== project.id; }).concat(res.boq);
      Storage.saveCache(); renderRoute(); toast('BOQ згенеровано: ' + res.boq.length + ' позицій', 'success');
    }).catch(function (e) { toast('Помилка: ' + (e && e.message || e), 'error'); });
  };
  var matBtn = el('button', { class: 'btn small' }, ['📦 Порахувати матеріали']);
  matBtn.onclick = function () {
    apiCall('computeProjectMaterials', { project_id: project.id }).then(function (res) {

function renderWorks(main) {
  main.appendChild(el('div', { class: 'page-title' }, ['Прайс робіт']));
  main.appendChild(el('div', { class: 'page-sub' }, [STATE.db.works.length + ' позицій']));
  var toolbar = el('div', { class: 'toolbar' });
  var search = el('input', { type: 'text', placeholder: 'Пошук роботи...' });
  var catSelect = el('select', {}, [el('option', { value: '' }, ['Всі категорії'])]);
  STATE.db.categories.forEach(function (c) { catSelect.appendChild(el('option', { value: c.name }, [c.num + '. ' + c.name])); });
  var viewToggle = el('select', {}, [
    el('option', { value: 'internal' }, ['Внутрішній вигляд']),
    el('option', { value: 'client' }, ['Клієнтський вигляд'])
  ]);
  viewToggle.value = STATE.ui.priceView;
  if (STATE.ui.worksSearchPrefill) { search.value = STATE.ui.worksSearchPrefill; delete STATE.ui.worksSearchPrefill; }
  if (STATE.ui.worksCatPrefill) { catSelect.value = STATE.ui.worksCatPrefill; delete STATE.ui.worksCatPrefill; }
  toolbar.appendChild(search); toolbar.appendChild(catSelect); toolbar.appendChild(viewToggle);
  toolbar.appendChild(el('div', { class: 'spacer' }));
  var csvBtn = el('button', { class: 'btn' }, ['⬇ CSV']);
  csvBtn.onclick = function () { downloadText_('BUDNEX_прайс.csv', arrayToCsv_(STATE.db.works), 'text/csv;charset=utf-8'); };
  toolbar.appendChild(csvBtn);
  var addBtn = el('button', { class: 'btn primary' }, ['+ Нова робота']); addBtn.onclick = function () { openWorkForm(); };
  toolbar.appendChild(addBtn);
  main.appendChild(toolbar);

  var tableWrap = el('div', {});
  main.appendChild(tableWrap);

  function draw() {
    tableWrap.innerHTML = '';
    var internal = viewToggle.value === 'internal';
    var q = fuzzyPrep_(search.value);
    var list = STATE.db.works.filter(function (w) {
      if (catSelect.value && w.category !== catSelect.value) return false;
      if (q && !fuzzyMatch_(w.name, q) && !fuzzyMatch_(w.subcategory, q) && !fuzzyMatch_(w.description, q)) return false;
      return true;
    });
    list.sort(function (a, b) { return (a.category + a.name).localeCompare(b.category + b.name, 'uk'); });
    var table = el('table', { class: 'dt' });
    var headCols = internal ? ['Категорія', 'Робота', 'Од.', 'Ціна виконавця', 'Націнка', 'Ціна клієнту', ''] : ['Категорія', 'Робота', 'Од.', 'Ціна'];
    table.appendChild(el('thead', {}, [el('tr', {}, headCols.map(function (h) { return el('th', {}, [h]); }))]));
    var tbody = el('tbody');
    var CAP = 600;
    list.slice(0, CAP).forEach(function (w) {
      var client = w.default_markup_type === 'percent' ? w.contractor_price * (1 + w.default_markup / 100) : Number(w.contractor_price) + Number(w.default_markup);
      var nameCell = w.name + (w.subcategory ? ' <span class="page-sub" style="display:inline">(' + esc(w.subcategory) + ')</span>' : '');
      var cells;
      if (internal) {
        cells = [w.category, nameCell, w.unit, fmtMoney(w.contractor_price), (w.default_markup_type === 'percent' ? '+' + w.default_markup + '%' : '+' + fmtMoney(w.default_markup)), fmtMoney(client)];
      } else {
        cells = [w.category, nameCell, w.unit, fmtMoney(client)];
      }
      var tr = el('tr', {}, cells.map(function (c, i) { var td = el('td', {}); td.innerHTML = String(c); return td; }));
      if (internal) {
        tr.style.cursor = 'pointer';
        tr.onclick = function () { openWorkForm(w); };
        var actionsTd = el('td', { style: 'white-space:nowrap;' });
        var editBtn = el('button', { class: 'btn small' }, ['✎']);
        editBtn.onclick = function (e) { e.stopPropagation(); openWorkForm(w); };
        var delBtn = el('button', { class: 'btn small danger' }, ['✕']);
        delBtn.onclick = function (e) {
          e.stopPropagation();
          if (!confirm('Видалити роботу "' + w.name + '" з прайсу?')) return;
          apiCall('deleteWork', { id: w.id }).then(function () {
            STATE.db.works = STATE.db.works.filter(function (x) { return x.id !== w.id; });
            Storage.saveCache(); toast('Роботу видалено', 'success'); draw();
          }).catch(function (e) { toast('Помилка: ' + e.message, 'error'); });
        };
        actionsTd.appendChild(editBtn); actionsTd.appendChild(delBtn);
        tr.appendChild(actionsTd);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    if (list.length > CAP) tableWrap.appendChild(el('div', { class: 'page-sub' }, ['Показано перші ' + CAP + ' з ' + list.length + '. Уточни пошук або категорію.']));
    else tableWrap.appendChild(el('div', { class: 'page-sub' }, ['Показано ' + list.length + ' з ' + STATE.db.works.length + ' позицій.']));
  }
  draw();
  search.oninput = draw; catSelect.onchange = draw;
  viewToggle.onchange = function () { STATE.ui.priceView = viewToggle.value; draw(); };
}

function renderCalendar(main) {
  main.appendChild(el('div', { class: 'page-title' }, ['Календар']));
  var cursor = STATE.ui.calendarCursor ? new Date(STATE.ui.calendarCursor) : new Date();
  cursor.setDate(1);

  function eventsFor(dateStr) {
    var evts = [];
    STATE.db.tasks.forEach(function (t) { if (t.deadline && t.deadline.slice(0, 10) === dateStr) evts.push({ type: 'task', label: t.title, obj: t.object_id }); });
    STATE.db.assignments.forEach(function (a) { if (a.start_date && a.start_date.slice(0, 10) === dateStr) evts.push({ type: 'assignment', label: 'Виїзд бригади', obj: a.object_id }); });
    STATE.db.objects.forEach(function (o) { if (o.planned_end_date && o.planned_end_date.slice(0, 10) === dateStr) evts.push({ type: 'deadline', label: 'Плановий кінець: ' + o.name, obj: o.id }); });
    return evts;
  }

  var nav = el('div', { style: 'display:flex;align-items:center;gap:10px;margin-bottom:14px;' });
  var prevBtn = el('button', { class: 'btn small' }, ['←']);
  var label = el('b', {}, [cursor.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' })]);
  var nextBtn = el('button', { class: 'btn small' }, ['→']);
  prevBtn.onclick = function () { cursor.setMonth(cursor.getMonth() - 1); STATE.ui.calendarCursor = cursor.toISOString(); renderRoute(); };
  nextBtn.onclick = function () { cursor.setMonth(cursor.getMonth() + 1); STATE.ui.calendarCursor = cursor.toISOString(); renderRoute(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  main.appendChild(nav);

  var grid = el('div', { class: 'grid', style: 'grid-template-columns:repeat(7,1fr);gap:6px;' });
  ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].forEach(function (d) { grid.appendChild(el('div', { class: 'page-sub', style: 'text-align:center;font-weight:600;' }, [d])); });
  var firstDay = new Date(cursor);
  var startOffset = (firstDay.getDay() + 6) % 7; // Monday-first
  var daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  for (var i = 0; i < startOffset; i++) grid.appendChild(el('div', {}));
  var today = new Date().toISOString().slice(0, 10);
  for (var d = 1; d <= daysInMonth; d++) {
    var dateObj = new Date(cursor.getFullYear(), cursor.getMonth(), d);

function downloadText_(filename, text, mime) {

  var url = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click(); document.body.removeChild(a);

}
function downloadBase64_(filename, base64, mime) {
  var byteChars = atob(base64);
  var byteNumbers = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(byteNumbers)], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function arrayToCsv_(rows) {
  if (!rows.length) return '';
  var headers = Object.keys(rows[0]);
  function esc_(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var lines = [headers.join(',')];
  rows.forEach(function (r) { lines.push(headers.map(function (h) { return esc_(r[h]); }).join(',')); });
  return lines.join('\n');
}

/* ============================== GLOBAL SEARCH ================================ */
// Ukrainian is a highly-inflected language, so plain substring matching misses most
// real matches: a search for "плитка" (nominative) won't find "плитки" (genitive),
// "плиткою" (instrumental), etc. This isn't full lemmatization, but a lightweight
// heuristic: for query words longer than ~4 letters, also try shorter stems of that
// word (dropping the last 1-2 letters, which is where most Ukrainian case endings
// live) against each word of the field, matched as a prefix in either direction.
function fuzzyPrep_(raw) {
  var q = (raw || '').trim().toLowerCase();
  return q.length >= 2 ? q : '';
}
function fuzzyMatch_(fieldVal, q) {
  if (!q) return true;
  if (fieldVal == null) return false;
  var field = String(fieldVal).toLowerCase();
  if (field.indexOf(q) !== -1) return true;
  var splitRe = /[^a-zа-яіїєґ0-9]+/i;
  var qWords = q.split(splitRe).filter(Boolean);
  var fWords = field.split(splitRe).filter(Boolean);
  if (!qWords.length) return false;
  return qWords.every(function (qw) {
    if (qw.length < 3) return field.indexOf(qw) !== -1;
    var stems = [qw];
    if (qw.length > 4) stems.push(qw.slice(0, -1));
    if (qw.length > 5) stems.push(qw.slice(0, -2));
    return fWords.some(function (fw) {
      return stems.some(function (s) { return fw.indexOf(s) === 0 || s.indexOf(fw) === 0; });
    });
  });
}
function matches_(obj, q, fields) {
  return fields.some(function (f) { return fuzzyMatch_(obj[f], q); });
}
function setupGlobalSearch() {
  var input = document.getElementById('globalSearch');
  var results = document.getElementById('searchResults');
  var PER_TYPE_CAP = 6;
  input.addEventListener('input', function () {
    var q = fuzzyPrep_(input.value);
    if (!q) { results.style.display = 'none'; return; }
    var hits = [];
    function collect(list, type, fields, hrefFn) {
      var found = 0;
      for (var i = 0; i < list.length && found < PER_TYPE_CAP; i++) {
        var item = list[i];
        if (matches_(item, q, fields)) { hits.push({ type: type, label: item.name || item.title || item.id, item: item, hrefFn: hrefFn }); found++; }
      }
    }
    collect(STATE.db.clients, 'Клієнт', ['name','phone','address','id'], function (c) { return '#/clients/' + c.id; });
    collect(STATE.db.objects, "Об'єкт", ['name','address','id'], function (o) { return '#/objects/' + o.id; });
    collect(STATE.db.works, 'Робота', ['name','category','subcategory','description','id'], function () { return '#/works'; });
    collect(STATE.db.partners, 'Бригада', ['name','phone','specialization','id'], function () { return '#/partners'; });
    collect(STATE.db.materials || [], 'Матеріал', ['name','category','id'], function () { return '#/materials'; });
    collect(STATE.db.suppliers || [], 'Постачальник', ['name','phone','id'], function () { return '#/materials'; });
    collect(STATE.db.tasks || [], 'Завдання', ['title','responsible','id'], function (t) { return t.object_id ? '#/objects/' + t.object_id : '#/tasks'; });
    collect(STATE.db.requests || [], 'Заявка', ['description','address','id'], function () { return '#/requests'; });
    results.innerHTML = '';
    if (!hits.length) { results.appendChild(el('div', { class: 'sr-item', style: 'cursor:default;color:var(--muted);' }, ['Нічого не знайдено'])); results.style.display = 'block'; return; }
    hits.forEach(function (h) {
      var row = el('div', { class: 'sr-item' }, [el('span', { class: 'sr-type' }, [h.type]), h.label]);
      row.onclick = function () {
        if (h.type === 'Робота') { STATE.ui.worksSearchPrefill = h.item.name; STATE.ui.worksCatPrefill = h.item.category; }
        location.hash = h.hrefFn(h.item); results.style.display = 'none'; input.value = '';
      };
      results.appendChild(row);
    });
    results.style.display = 'block';
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('#searchbox')) results.style.display = 'none'; });
}

      CONFIG.API_URL = url;
      apiCall('ping', {}).then(function () {
        localStorage.setItem('budnex_api_url', url);
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        initApp();
      }).catch(function (e) {
        errEl.textContent = 'Не вдалося підключитися: ' + e.message + '. Перевір URL і що доступ надано "Anyone".';
        errEl.style.display = 'block';
      });
    });
    return;
  }
  document.getElementById('app').style.display = 'flex';
  initApp();
  if (!location.hash) location.hash = '#/dashboard';
}

boot();
</script>
</body>
</html>
